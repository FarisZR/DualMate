name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach the APK to (e.g. v2.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version info from tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          VERSION_NAME="${TAG#v}"
          BASE="${VERSION_NAME%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          MAJOR="${MAJOR:-0}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Run Android unit tests
        run: ./android/gradlew -p android :app:testDebugUnitTest --console=plain

      - name: Build arm64 APK
        run: |
          flutter build apk \
            --target-platform android-arm64 \
            --split-per-abi \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.version_code }}" \
            --dart-define=APP_VERSION="${{ steps.version.outputs.version_name }}"

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: build/app/outputs/flutter-apk/*arm64-v8a-release.apk

      - name: Build Play Store AAB
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          flutter build appbundle \
            --release \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.version_code }}" \
            --dart-define=APP_VERSION="${{ steps.version.outputs.version_name }}" \
            --dart-define=SENTRY_ENVIRONMENT=production \
            --dart-define=SENTRY_RELEASE="dualmate@${{ steps.version.outputs.version_name }}"

      - name: Upload Play Store AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: dualmate-playstore-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Validate Play publishing secret
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing required secret: PLAY_SERVICE_ACCOUNT_JSON"
            exit 1
          fi

      - name: Extract Play Store release notes
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RELEASE_BODY="$(gh release view "$TAG" --json body --jq .body)"

          mkdir -p distribution/whatsnew
          printf '%s\n' "$RELEASE_BODY" > release-body.md

          python3 <<'PY'
          import re
          from pathlib import Path

          body = Path("release-body.md").read_text(encoding="utf-8")

          heading = re.compile(
              r"^\s{0,3}#{1,6}\s+Play Store release notes\s*$",
              re.IGNORECASE | re.MULTILINE,
          )
          next_heading = re.compile(
              r"^\s{0,3}#{1,6}\s+\S.*$",
              re.MULTILINE,
          )

          match = heading.search(body)
          if not match:
              raise SystemExit("Missing required section: ## Play Store release notes")

          start = match.end()
          next_match = next_heading.search(body, start)
          notes = body[start:next_match.start() if next_match else len(body)].strip()

          if not notes:
              raise SystemExit("The Play Store release notes section is empty.")

          notes = re.sub(r"\[([^\]]+)\]\([^)]+\)", r"\1", notes).strip()

          if len(notes) > 500:
              raise SystemExit(
                  f"Play Store release notes are too long: {len(notes)} chars. "
                  "Keep the Play-specific section under 500 characters."
              )

          out = Path("distribution/whatsnew")
          for locale in ["en-US", "de-DE"]:
              (out / f"whatsnew-{locale}").write_text(notes + "\n", encoding="utf-8")

          print(notes)
          PY

      - name: Publish draft AAB to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.fariszr.dualmate
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: production
          status: draft
          releaseName: ${{ steps.version.outputs.version_name }}
          whatsNewDirectory: distribution/whatsnew
          changesNotSentForReview: true
