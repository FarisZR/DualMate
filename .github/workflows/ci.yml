name: CI

on:
  push:
    branches: [v2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Check cyclomatic complexity
        run: dart run dart_code_linter:metrics analyze lib --set-exit-on-violation-level=warning

      - name: Run tests
        run: flutter test

      - name: Check DST calendar boundaries
        env:
          TZ: Europe/Berlin
        run: >-
          flutter test --no-pub
          test/common/util/date_utils_test.dart
          test/canteen/data/canteen_meal_repository_test.dart
          test/canteen/ui/canteen_page_bounds_test.dart

      - name: Check fixture startup notifications
        run: >-
          flutter test --no-pub --dart-define=PERF_TEST_OFFLINE_FIXTURES=true
          test/schedule/ui/schedule_page_test.dart
          --plain-name 'visible startup does not notify providers during construction'

      - name: Run Android unit tests
        run: ./android/gradlew -p android :app:testDebugUnitTest --console=plain
